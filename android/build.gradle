buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        // Crashlytics: the version @react-native-firebase/app 24.1.0 pins (sdkVersions.android
        // .firebaseCrashlyticsGradle). Applied in app/build.gradle — without that apply, the SDK
        // finds no build ID and the app throws on launch.
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.7")
    }
}

apply plugin: "com.facebook.react.rootproject"
