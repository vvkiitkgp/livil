name: CI

# The gate that makes the standards in kb/standards/ real. Before this existed,
# every rule was advisory because nothing ran at merge time.

# Runs on every branch, not just main. The common `[main] + pull_request` pattern
# assumes every change arrives via a PR; here feature branches are pushed and
# reviewed directly, so gating on PRs would mean most pushes get no feedback at
# all. workflow_dispatch allows a manual re-run without an empty commit.
on:
  push:
  pull_request:
  workflow_dispatch:
  # For schema-parity only. Drift can begin without a push — a migration applied by
  # hand, or a merge that nobody ever applied — so the check cannot depend on someone
  # happening to commit. 07:00 UTC daily.
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.11.0'

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` runs postinstall, which applies patches/react-native-video.
      # If the patch fails to apply, the install fails — which is the correct
      # outcome. A build that silently drops the patch produces an app whose
      # lock-screen controls are broken in ways no test here would catch.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # The tracker adapter is .mjs outside the React Native jest project, so `npm test` does
      # not reach it. Run explicitly rather than teaching that jest config an ESM transform to
      # cover four files — and run it at all, because the tests worth having here are the
      # permission refusals, and an untested refusal is a rule that only looks like a control
      # (LIV-93 is the same lesson from the other direction).
      - name: Tracker adapter tests
        run: npm run test:tracker

  knowledge-base:
    name: knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Structural rules: frontmatter, ownership, reachability, size caps, and
      # — critically — that nothing under kb/private/ has become tracked in this
      # public repository.
      - name: Validate knowledge base
        run: npm run kb:validate

      # Tier-1 documents are generated. If a source change makes them stale and
      # nobody regenerated, fail rather than let the docs drift. This is the
      # mechanism that prevents the class of drift that put a 21-release-old
      # version number in CLAUDE.md.
      #
      # Runs without kb/private/, so only the public generators execute.
      # The generators that write to kb/private/ skip automatically when that repo is
      # absent, as it is here. This step is a real gate, not decorative.
      - name: Check generated docs are current
        run: npm run kb:generate -- --check

  drift:
    name: version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLAUDE.md must match build.gradle
        run: node scripts/check-version-sync.mjs

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest

    # Replays every migration against an empty Postgres. This is the check that
    # would have caught INC-0003, where a migration referenced a column that did
    # not exist: it applied without error and the feature broke silently for a day,
    # because Postgres does not validate column references inside a plpgsql body
    # until the function is called.
    #
    # Only possible since the baseline migration exists — before that, 12 core
    # tables had no CREATE TABLE anywhere and a replay failed immediately.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # Migrations reference auth.uid(), the auth schema, and Supabase's storage
      # objects. A bare Postgres has none of these, so stub just enough for the
      # DDL to apply. The stubs are NOT a behavioural simulation — this job proves
      # the migrations are syntactically valid and internally consistent, not that
      # the policies do what they claim.
      - name: Prepare Supabase-compatible shims
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create schema if not exists storage;
          create schema if not exists realtime;
          -- `email` and its unique index mirror the real auth.users. LIV-74's deletion
          -- ledger hashes the address, and the re-signup test needs the uniqueness to be
          -- present for "the address is free again" to mean anything.
          create table if not exists auth.users (id uuid primary key, email text);
          create unique index if not exists users_email_key on auth.users (email);
          create or replace function auth.uid() returns uuid
            language sql stable as $$ select null::uuid $$;
          create or replace function auth.role() returns text
            language sql stable as $$ select 'authenticated'::text $$;
          create table if not exists storage.buckets (id text primary key, name text, public boolean);
          create table if not exists storage.objects (
            id uuid default gen_random_uuid() primary key,
            bucket_id text, name text, owner uuid);
          create or replace function storage.foldername(name text) returns text[]
            language sql immutable as $$ select string_to_array(name, '/') $$;
          create or replace function realtime.send(payload jsonb, event text, topic text, private boolean default true)
            returns void language sql as $$ select $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='authenticated') then
              create role authenticated;
            end if;
            if not exists (select 1 from pg_roles where rolname='anon') then
              create role anon;
            end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then
              create role service_role;
            end if;
          end $$;
          create publication supabase_realtime;
          SQL

      - name: Apply every migration in order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "All migrations applied cleanly."

      # The authorization tests `set role authenticated` and attempt REAL writes, so
      # that role needs table privileges — otherwise every denial would come from a
      # missing GRANT rather than from RLS, and the tests would pass for the wrong
      # reason. Run after migrations so it covers every table they created.
      - name: Grant table access to the app roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public to authenticated, anon;
          grant all on all tables in schema public to authenticated;
          grant select on all tables in schema public to anon;
          grant all on all sequences in schema public to authenticated;
          -- The jmem_insert policy's EXISTS reads jam_rooms and conversation_members,
          -- whose own policies call is_conversation_member(). RLS applies to tables
          -- referenced inside a policy expression, so `authenticated` must be able to
          -- execute those SECURITY DEFINER helpers or a legitimate member is denied
          -- for the wrong reason.
          grant execute on all functions in schema public to authenticated;

          -- NOT granted to `anon`, deliberately, and this was a real gate defect until
          -- 2026-07-22. A blanket grant to anon here UNDID every `revoke execute ... from
          -- anon` the migrations issue, so CI was systematically MORE PERMISSIVE than
          -- production and no test could ever observe an anon-reachable function. It was
          -- found when `delete #2` ("anon cannot execute delete_my_account") failed in CI
          -- while being true in production.
          --
          -- Dropping anon here is safe: PostgreSQL's default is EXECUTE TO PUBLIC, which
          -- anon already inherits, so every function keeps working EXCEPT the handful the
          -- migrations explicitly revoke — which is exactly the production shape we want
          -- to test against. See the same argument in
          -- 20260722160000_counters_are_not_client_writable.sql, where the harness
          -- re-granting is the reason a column-level REVOKE was rejected as a mechanism.
          SQL


      # RLS is the entire authorization perimeter (ADR-0004), and until now nothing
      # asserted that a non-owner is denied anything.
      #
      # These attempt REAL inserts as the `authenticated` role, so a reverted policy
      # fails them. An earlier version evaluated a hand-written COPY of the predicate
      # and would have passed with the policy reverted — it could not have caught
      # D-53 despite claiming to. Found by the code-reviewer agent.
      - name: Authorization tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/authorization.test.sql

      # The RPC signature IS the service contract — there is no API tier (ADR-0004),
      # and the client coalesces every field it reads, so a dropped key fails silently.
      - name: RPC contract tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/rpc-contracts.test.sql

      # PROP-0004 / ADR-0009 — Stories hardening. Attempts REAL writes as the
      # `authenticated` role so the deployed trigger + tightened stories_insert are
      # what allow or deny: a client-supplied expires_at must be overwritten, an
      # unlinked / non-upload repost must be rejected, list_active_stories bounded.
      - name: Stories hardening tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/stories-harden.test.sql

      # LIV-78 — the `messages` UPDATE boundary. msg_update shipped with no
      # WITH CHECK, so the USING expression was applied to the NEW row and
      # constrained only sender_id: an author could move their own message into
      # another conversation, and — via the shape PostgREST emits for an
      # unfiltered PATCH — into one they are not even a member of. Attempts REAL
      # updates as `authenticated`, so the deployed policy AND the freeze trigger
      # are what allow or deny. Every denial is paired with an assertion on the
      # stored row, because an UPDATE filtered out by USING raises nothing.
      - name: messages write-boundary tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/messages-write-boundary.test.sql

      # LIV-74 — account deletion deletes the user's messages (reversing ADR-0014) and
      # records the departure in a ledger no client may read. The assertions that carry
      # the weight are the ones about someone ELSE's data: a group co-member's messages
      # survive, a third party's DM is untouched, and a reserved username is released
      # only back to the address that gave it up.
      - name: account deletion tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/account-deletion-liv74.test.sql

      # profiles.comments_friends_only shipped in 1.1.14 with a Settings switch and NO
      # enforcement — post_comments_insert_self checked only `author_id = auth.uid()`,
      # so the control looked like protection and was not one. Step 1 is that exact
      # attack. The suite also pins the ways a fix goes wrong in the other direction:
      # refusing a real friend, locking an author out of their own post, or making the
      # restriction apply to everyone rather than only those who opted in.
      - name: comments friends-only tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/comments-friends-only.test.sql

      # A credit names somebody, so answering it is the one write a collaborator gets on a
      # track that is not theirs. Asserts that the write is status-only (the previous policy
      # let a tagged user rewrite their own role), that an answer is final, and that being
      # credited notifies once at publish rather than again on every repost.
      - name: credit accept/decline tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/credits-accept-decline.test.sql

      # The welcome email is sent once per account, ever, and both clients ask for it on
      # every launch — so the claim RPC is the only thing between an eager client and
      # repeat mail. Asserts one winner per account, no mail to accounts that predate the
      # feature, a capped retry after a failure, and a ledger no client can read or write.
      - name: Welcome email claim tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/welcome-email.test.sql

      # Tags are the only column on tracks that decides whether a stranger finds the track,
      # and both ways of breaking that are silent: a tag stored in a form the search box
      # cannot rebuild is unfindable forever, and an open UPDATE would let anyone file
      # somebody else's track under any word. Asserts the stored shape, the single
      # representation of "no tags", the deliberate looseness, and uploader-only writes.
      - name: Track tag tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/track-tags.test.sql

      # A SECURITY DEFINER function with no pinned search_path resolves unqualified
      # names using the caller's search_path — the LIV-11 finding #2 escalation shape.
      # This asserts the property holds for every DEFINER function, so a new one added
      # without `set search_path` fails on the migration that introduces it.
      - name: SECURITY DEFINER search_path lint
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls/definer-search-path.test.sql

  schema-parity:
    name: production matches the repo
    runs-on: ubuntu-latest

    # ========================================================================
    # The gap between "CI proved it correct" and "it is installed".
    #
    # The `migrations` job above replays every migration and property-tests the
    # result. That proves correctness. It says nothing about whether production
    # ever received it. On 2026-07-22 the LIV-10 authorization fix sat merged and
    # unapplied — the repo declared 95 policies, production enforced 99 — while
    # the PR, the commit history, and every generated kb/ document read as fixed.
    # See D-55. This job is the check that would have gone red.
    #
    # WHY NOT A PRE-MERGE GATE: parity is false BY DEFINITION between merging a
    # migration and applying it, so requiring it on its own PR would block every
    # migration PR by construction. It runs after merge and daily instead: main
    # goes red the moment something merges unapplied, and stays red until someone
    # applies it. Make it a required context so the NEXT PR inherits the failure —
    # that is what stops drift accumulating.
    #
    # WHY postgres:17 HERE AND 15 ABOVE: production is 17.6. Policy predicates are
    # compared as deparsed text (pg_get_expr), so the server version is part of the
    # comparison. Verified 2026-07-22 that PG16 and PG17 deparse all 95 policies
    # identically, so the risk is small — but matching production removes the class
    # rather than betting on it. That the main replay job tests a version production
    # does not run is a separate question, deliberately not changed here.
    # ========================================================================
    # workflow_dispatch is included so this can be run on demand, from any branch, without
    # merging first. Without it the only way to learn whether the job works is to merge it
    # and watch main — which is the same "find out in production" habit this job exists to
    # end. It also gives an on-demand answer to "is production still in sync right now?"
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # Same shims as the `migrations` job. Kept in step with it by hand; if they
      # drift, this job fails on replay rather than silently comparing the wrong thing.
      - name: Prepare Supabase-compatible shims
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create schema if not exists storage;
          create schema if not exists realtime;
          create table if not exists auth.users (id uuid primary key, email text);
          create unique index if not exists users_email_key on auth.users (email);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.role() returns text language sql stable as $$ select 'authenticated'::text $$;
          create table if not exists storage.buckets (id text primary key, name text, public boolean);
          create table if not exists storage.objects (id uuid default gen_random_uuid() primary key, bucket_id text, name text, owner uuid);
          create or replace function storage.foldername(name text) returns text[] language sql immutable as $$ select string_to_array(name, '/') $$;
          create or replace function realtime.send(payload jsonb, event text, topic text, private boolean default true) returns void language sql as $$ select $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role; end if;
          end $$;
          create publication supabase_realtime;
          SQL

      - name: Apply every migration in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "  $(basename "$f")"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # NOTE the blanket grants from the `migrations` job are deliberately NOT run
      # here. They exist to let the authorization tests act as `authenticated`, and
      # one of them — `grant execute on all functions ... to anon` — would re-grant
      # exactly what LIV-10 revoked, making the fingerprint disagree with production
      # for a reason that is purely an artifact of the test harness.
      - name: Compare against production
        env:
          EPHEMERAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: scripts/schema-parity.sh

  board-readonly:
    name: board is proposal-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Architecture Board proposes; it does not implement. This is the layer
      # that actually enforces that — a prompt cannot fail a build, and an agent
      # can be argued out of an instruction.
      #
      # Also blocks paths closed to EVERY agent (the native patch, signing config,
      # kb/private) regardless of who authored the change.
      - name: Board may write only under kb/
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          node scripts/enforce-board-readonly.mjs --range "$BASE..HEAD"

  agent-scope:
    name: agents write only where tests exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Overall coverage is ~1%. Implementation agents may write only where tests
      # would actually fail if the behaviour broke; everywhere else they propose and
      # a human implements. Scoping lives in .claude/autonomy-config.yml.
      #
      # Also enforces the never-list (native patch, signing config, keystore,
      # kb/private, supabase client) for HUMAN commits too — those are unrecoverable
      # or invisible regardless of who changed them.
      - name: Agent writes stay inside tested paths
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          node scripts/enforce-agent-scope.mjs --range "$BASE..HEAD"
