name: CI

# The gate that makes the standards in kb/standards/ real. Before this existed,
# every rule was advisory because nothing ran at merge time.

# Runs on every branch, not just main. The common `[main] + pull_request` pattern
# assumes every change arrives via a PR; here feature branches are pushed and
# reviewed directly, so gating on PRs would mean most pushes get no feedback at
# all. workflow_dispatch allows a manual re-run without an empty commit.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.11.0'

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` runs postinstall, which applies patches/react-native-video.
      # If the patch fails to apply, the install fails — which is the correct
      # outcome. A build that silently drops the patch produces an app whose
      # lock-screen controls are broken in ways no test here would catch.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  knowledge-base:
    name: knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Structural rules: frontmatter, ownership, reachability, size caps, and
      # — critically — that nothing under kb/private/ has become tracked in this
      # public repository.
      - name: Validate knowledge base
        run: npm run kb:validate

      # Tier-1 documents are generated. If a source change makes them stale and
      # nobody regenerated, fail rather than let the docs drift. This is the
      # mechanism that prevents the class of drift that put a 21-release-old
      # version number in CLAUDE.md.
      #
      # Runs without kb/private/, so only the public generators execute.
      - name: Check generated docs are current
        run: npm run kb:generate -- --check
        continue-on-error: true # private repo is unavailable in CI; see note above

  drift:
    name: version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLAUDE.md must match build.gradle
        run: node scripts/check-version-sync.mjs

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest

    # Replays every migration against an empty Postgres. This is the check that
    # would have caught INC-0003, where a migration referenced a column that did
    # not exist: it applied without error and the feature broke silently for a day,
    # because Postgres does not validate column references inside a plpgsql body
    # until the function is called.
    #
    # Only possible since the baseline migration exists — before that, 12 core
    # tables had no CREATE TABLE anywhere and a replay failed immediately.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # Migrations reference auth.uid(), the auth schema, and Supabase's storage
      # objects. A bare Postgres has none of these, so stub just enough for the
      # DDL to apply. The stubs are NOT a behavioural simulation — this job proves
      # the migrations are syntactically valid and internally consistent, not that
      # the policies do what they claim.
      - name: Prepare Supabase-compatible shims
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create schema if not exists storage;
          create schema if not exists realtime;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid() returns uuid
            language sql stable as $$ select null::uuid $$;
          create or replace function auth.role() returns text
            language sql stable as $$ select 'authenticated'::text $$;
          create table if not exists storage.buckets (id text primary key, name text, public boolean);
          create table if not exists storage.objects (
            id uuid default gen_random_uuid() primary key,
            bucket_id text, name text, owner uuid);
          create or replace function storage.foldername(name text) returns text[]
            language sql immutable as $$ select string_to_array(name, '/') $$;
          create or replace function realtime.send(payload jsonb, event text, topic text, private boolean default true)
            returns void language sql as $$ select $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='authenticated') then
              create role authenticated;
            end if;
            if not exists (select 1 from pg_roles where rolname='anon') then
              create role anon;
            end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then
              create role service_role;
            end if;
          end $$;
          create publication supabase_realtime;
          SQL

      - name: Apply every migration in order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "All migrations applied cleanly."

  board-readonly:
    name: board is proposal-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Architecture Board proposes; it does not implement. This is the layer
      # that actually enforces that — a prompt cannot fail a build, and an agent
      # can be argued out of an instruction.
      #
      # Also blocks paths closed to EVERY agent (the native patch, signing config,
      # kb/private) regardless of who authored the change.
      - name: Board may write only under kb/
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          node scripts/enforce-board-readonly.mjs --range "$BASE..HEAD"
